         the CSP's script-src, so the sha256 hash up in the CSP meta tag must
         match this script's EXACT text. If you edit anything between the
         import-map script tags below, regenerate the hash:
           node -e "const s=require('fs').readFileSync('ui/index.html','utf8').match(/<script type=\"importmap\">([\s\S]*?)<\/script>/)[1];console.log(require('crypto').createHash('sha256').update(s,'utf8').digest('base64'))"
         test/renderer-modules.test.js enforces that the hash tracks the map. -->

    {
      "imports": {
        "preact": "../node_modules/preact/dist/preact.module.js",
